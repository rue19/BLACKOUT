[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:hydradb]
command=/app/hydradb/graph-node
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    CLOUD_PROVIDER="local",
    LOCAL_PATH="/data/store",
    GRAPH_NAMESPACE="default",
    GRAPH_ID="default",
    GRAPH_CELL_ID="cell-0",
    GRAPH_CELLS="cell-0",
    GRAPH_NODE_ID="node-0",
    GRAPH_BOLT_NODE_ADDRESSES="node-0=127.0.0.1:7687",
    GRAPH_ADVERTISED_BOLT_ADDR="127.0.0.1:7687",
    GRAPH_DATA_CACHE_DIR="/data/cache",
    GRAPH_AUTH_TOKEN_FILE="/data/auth-token",
    GRAPH_ALLOW_PLAINTEXT="true",
    RUST_MIN_STACK="33554432",
    RUST_LOG="info"

[program:backend]
command=sh -c "sleep 10 && python seed_on_startup.py && exec uvicorn main:app --host 0.0.0.0 --port 8000"
directory=/app/backend
autostart=true
autorestart=true
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    HYDRADB_BOLT_URI="bolt://127.0.0.1:7687",
    HYDRADB_AUTH_TOKEN="local-development-token-32-bytes",
    CORS_ORIGINS="*"

[program:frontend]
command=nginx -g "daemon off;"
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="80"
