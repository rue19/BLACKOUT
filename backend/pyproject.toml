[project]
name = "blackout-backend"
version = "0.1.0"
description = "BLACKOUT backend API - simulation, resilience score, recovery optimizer"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
