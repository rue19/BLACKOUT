services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    user: "0:0"
    network_mode: host
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: 33554432
    volumes:
      - ./hydradb-data/store:/data/store
      - ./hydradb-data/cache:/data/cache
      - ./hydradb-data/auth-token:/data/auth-token:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    environment:
      HYDRADB_BOLT_URI: bolt://127.0.0.1:7687
      HYDRADB_AUTH_TOKEN: local-development-token-32-bytes
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    network_mode: host
